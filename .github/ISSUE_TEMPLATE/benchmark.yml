name: Performance report
description: TUFF got slower after an update, or is much slower than similar Macs on the leaderboard.
title: "[Performance]: "
labels:
  - performance
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Just want to share how fast TUFF is on your Mac? Run **Benchmarks** in
        TUFF and press **Share on GitHub** instead. It goes on the
        [leaderboard](https://rexmhall09.github.io/TUFF/benchmarks/).

        This form is for problems: something got slower, or is far off what
        similar Macs get. Repeated runs help a lot more than one number, and a
        link to your benchmark post is ideal. Leave out private prompts.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of report is this?
      options:
        - Slower after updating TUFF
        - Slower than expected on my Mac
        - Measurement on hardware not tested before
        - Comparison between two builds or settings
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TUFF version or commit
      description: For a comparison, give both, for example "8.0.1 vs 8.0.2".
      placeholder: 8.0.2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac, chip, GPU cores and memory
      placeholder: MacBook Air, M2, 10-core GPU, 16 GB
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version (and Swift version for source builds)
      placeholder: macOS 26.6, Swift 6.4
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Gemma 4 E2B
        - Gemma 4 E4B
        - Gemma 4 12B QAT
        - Gemma 4 26B-A4B
        - Qwen3.6 35B-A3B
        - Qwen3.8 Flash Next
        - GPT-OSS 20B
        - GPT-OSS 120B
        - MiniMax M2.7
        - Several models
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or settings
      description: The exact command, or the app settings (context, expert cache, prefill chunk, thinking, sampling).
      render: shell
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Prompt tokens, generated tokens, whether the model had just been loaded, and what else was running.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Every repetition, not only the best one. Include prefill time, time to first token, decode tok/s and stop reason when you have them.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output check (optional)
      description: When comparing builds, did both produce the same text or token IDs?

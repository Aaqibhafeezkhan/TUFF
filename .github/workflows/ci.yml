name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run all model-free checks, packaging and updater fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: Scripts/check.sh

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>TUFF Benchmarks: local LLM speed on Apple Silicon Macs</title>
<meta name="description" content="Community benchmarks of TUFF on Apple Silicon: decode speed, prompt processing and time to first token for Gemma, Qwen, GPT-OSS and MiniMax models on real Macs.">
<meta property="og:title" content="TUFF Benchmarks">
<meta property="og:description" content="How fast local language models run on real Apple Silicon Macs, measured by TUFF users.">
<meta property="og:image" content="https://tuff-app.github.io/TUFF/assets/tuff-chat.png">
<link rel="icon" type="image/png" href="../assets/tuff-icon.png">
<style>
  :root {
    --bg: #07070a;
    --surface: #111117;
    --surface-raised: #191921;
    --surface-hover: #1e1e28;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #f5f5f7;
    --muted: #a1a1aa;
    --faint: #71717a;
    --violet: #6F4DFF;
    --violet-light: #A78BFA;
    --green: #4ade80;
    --amber: #fbbf24;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 420px at 15% -10%, rgba(111, 77, 255, 0.22), transparent 70%),
      radial-gradient(700px 360px at 95% 0%, rgba(167, 139, 250, 0.10), transparent 70%);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
  header { padding: 40px 0 8px; }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 26px; }
  .crumbs img { width: 22px; height: 22px; border-radius: 6px; }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--text); }
  .eyebrow { color: var(--violet-light); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 8px; }
  h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.025em; }
  h2 { font-size: 19px; margin: 36px 0 12px; letter-spacing: -0.01em; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; row-gap: 2px; }
  h2 small { font-size: 13px; font-weight: 400; color: var(--faint); }
  p { color: var(--muted); margin: 0 0 12px; }
  a { color: var(--violet-light); }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--text); }
  .lead { max-width: 720px; font-size: 16px; }

  /* Summary */
  .stats { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 26px 0 6px; }
  .stat { background: linear-gradient(180deg, var(--surface-raised), var(--surface)); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
  .stat .label { color: var(--muted); font-size: 12.5px; }
  .stat .value { font-size: 26px; font-weight: 680; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .detail { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.accent .value { color: var(--violet-light); }

  /* Fastest per model */
  .bars { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 190px) 1fr auto; gap: 14px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--text); text-decoration: none; }
  .bar-row:hover { background: var(--surface-hover); }
  .bar-row .name { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .name small { display: block; color: var(--faint); font-weight: 400; font-size: 12px; }
  .track { height: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--violet-light)); min-width: 6px; }
  .bar-row .figure { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 92px; text-align: right; }
  .scale-note { font-size: 12.5px; color: var(--faint); margin: 8px 4px 0; }

  /* Filters */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 12px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .controls .spacer { flex: 1; }
  select, .toggle, .reset {
    background: var(--surface-raised); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13.5px;
  }
  select { appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  select:hover, .reset:hover { border-color: var(--border-strong); }
  select.active { border-color: color-mix(in srgb, var(--violet) 60%, transparent); color: var(--violet-light); }
  .reset { cursor: pointer; color: var(--muted); }
  .toggle { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--violet); margin: 0; }
  .segmented { display: inline-flex; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .segmented button {
    background: transparent; color: var(--muted); border: 0; padding: 5px 13px; font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 999px;
  }
  .segmented button[aria-pressed="true"] { background: var(--violet); color: #fff; }
  :is(select, button, a, input):focus-visible { outline: 2px solid var(--violet-light); outline-offset: 2px; }

  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { transition: background 120ms ease; }
  tbody tr:hover { background: var(--surface-hover); }
  tr:last-child td { border-bottom: 0; }
  thead th { color: var(--faint); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface-raised); position: sticky; top: 0; }
  th button { all: unset; cursor: pointer; }
  th[aria-sort] { color: var(--violet-light); }
  th[aria-sort] button::after { content: " ▾"; }
  th[aria-sort="ascending"] button::after { content: " ▴"; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { color: var(--faint); width: 1%; font-variant-numeric: tabular-nums; }
  td a { color: var(--text); text-decoration: none; }
  td a:hover { color: var(--violet-light); text-decoration: underline; }
  .speed { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .speed .track { width: 74px; height: 6px; }
  .speed strong { font-weight: 620; }
  .range { color: var(--faint); font-size: 12px; margin-left: 4px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--muted); vertical-align: 1px; }
  .badge.verified { color: var(--violet-light); border-color: color-mix(in srgb, var(--violet) 55%, transparent); background: rgba(111, 77, 255, 0.10); }
  .badge.held { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
  .state { padding: 44px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
  .note { font-size: 13px; color: var(--faint); margin-top: 12px; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin: 6px 0 4px; }
  .card { background: linear-gradient(180deg, var(--surface-raised), var(--surface)); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12.5px; }
  .card .value { font-size: 24px; font-weight: 680; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .faster { color: var(--green); }
  .slower { color: var(--amber); }

  /* Footer */
  footer { padding: 28px 0 56px; margin-top: 40px; border-top: 1px solid var(--border); }
  footer p { font-size: 13.5px; max-width: 760px; }
  .steps { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .step h3 { margin: 0 0 6px; font-size: 15px; }
  .step p { font-size: 13.5px; margin: 0 0 8px; }
  .step .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: rgba(111, 77, 255, 0.16); color: var(--violet-light); font-size: 13px; font-weight: 700; margin-bottom: 10px; }

  @media (max-width: 860px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .steps { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    header { padding-top: 26px; }
    .bar-row { grid-template-columns: 1fr auto; }
    .bar-row .track { grid-column: 1 / -1; order: 3; }
    .speed .track { display: none; }
    .controls .spacer { display: none; }
    .stat .detail { white-space: normal; }
    h2 small { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { tbody tr { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumbs"><img src="../assets/tuff-icon.png" alt=""><a href="../">TUFF</a> / <a href="#">Benchmarks</a><span id="crumb-extra"></span></div>
    <h1 id="title">Benchmarks</h1>
    <p class="lead" id="lead">How fast models run in TUFF on real Macs, measured by the people who own them.</p>
  </header>
  <main id="view" aria-live="polite">
    <div class="state">Loading results…</div>
  </main>
  <footer>
    <p>Add your Mac: in TUFF, open Benchmarks, run it, and share. Writes is decode speed; reads prompt is how fast a ~1,500-token prompt is processed.
      <a href="https://github.com/tuff-app/TUFF/blob/main/docs/BENCHMARKS.md">How benchmarks work</a>.</p>
  </footer>
</div>
<script src="benchmarks.js"></script>
</body>
</html>
